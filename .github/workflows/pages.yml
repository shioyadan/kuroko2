name: Deploy Kuroko Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser and test fonts
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core

      - name: Verify production app
        run: make check

      - name: Package offline app
        run: make archive ARCHIVE_NAME=kuroko-latest

      - name: Prepare Pages content
        run: |
          mkdir -p dist-site
          cp dist-web/index.html dist-site/index.html
          cp dist-release/kuroko-latest.zip dist-site/kuroko-latest.zip
          touch dist-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: work/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
